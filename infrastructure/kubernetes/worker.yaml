apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: agentmesh
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: agentmesh
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: agentmesh/worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agentmesh-config
            - secretRef:
                name: agentmesh-secrets
          env:
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: agentmesh-config
                  key: SERVICE_NAME_WORKER
          # Celery has no HTTP port; use process liveness via celery inspect ping when available.
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - worker.celery_app.celery_app
                - inspect
                - ping
                - --timeout
                - "5"
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentmesh
  namespace: agentmesh
  labels:
    app.kubernetes.io/part-of: agentmesh
  annotations:
    # nginx ingress controller (Kind/Minikube addon). Adjust class for your cluster.
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: agentmesh.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000

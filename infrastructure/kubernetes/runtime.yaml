apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
  namespace: agentmesh
  labels:
    app.kubernetes.io/name: runtime
    app.kubernetes.io/part-of: agentmesh
    app.kubernetes.io/component: runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime
    spec:
      containers:
        - name: runtime
          image: agentmesh/runtime:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: agentmesh-config
            - secretRef:
                name: agentmesh-secrets
          env:
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: agentmesh-config
                  key: SERVICE_NAME_RUNTIME
          # TCP probe on gRPC port until a dedicated health RPC is exposed.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: runtime
  namespace: agentmesh
  labels:
    app.kubernetes.io/name: runtime
spec:
  selector:
    app.kubernetes.io/name: runtime
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc

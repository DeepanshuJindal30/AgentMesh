name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -q
        env:
          AUTH_DEV_BYPASS: "true"
          JWT_SECRET: test-secret

  runtime:
    name: Runtime tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/runtime/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest -q

  web:
    name: Web lint, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  docker:
    name: Docker build (api / worker / runtime / web)
    runs-on: ubuntu-latest
    needs: [api, runtime, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: services/api
            image: agentmesh/api
          - context: services/worker
            image: agentmesh/worker
          - context: services/runtime
            image: agentmesh/runtime
          - context: apps/web
            image: agentmesh/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          if [ -n "${{ matrix.dockerfile }}" ]; then
            docker build -t ${{ matrix.image }}:ci -f ${{ matrix.dockerfile }} ${{ matrix.context }}
          else
            docker build -t ${{ matrix.image }}:ci ${{ matrix.context }}
          fi

  k8s-validate:
    name: Kustomize build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: |
          kubectl kustomize infrastructure/kubernetes/ > /tmp/agentmesh-manifests.yaml
          echo "Rendered $(wc -l < /tmp/agentmesh-manifests.yaml) lines"
          # Basic sanity: required kinds present
          grep -q "kind: HorizontalPodAutoscaler" /tmp/agentmesh-manifests.yaml
          grep -q "kind: Ingress" /tmp/agentmesh-manifests.yaml
          grep -q "name: api" /tmp/agentmesh-manifests.yaml
